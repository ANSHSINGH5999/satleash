<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 760" width="1240" height="760" role="img" aria-labelledby="t d">
  <title id="t">Lifeboat architecture and trust boundaries</title>
  <desc id="d">LND feeds Lifeboat, which encrypts, fingerprints and publishes backups to untrusted Nostr relays, verifies them, and restores them into a new LND created from the same seed. Everything read back from relays is validated locally.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#c9c9d2"/></marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#7be3a3"/></marker>
    <marker id="p" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#a78bfa"/></marker>
    <style>
      text{font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;fill:#f2f2f5}
      .h{font-size:13px;letter-spacing:.14em;font-weight:600}
      .t{font-size:17px;font-weight:600}
      .s{font-size:13px;fill:#b4b4c0}
      .m{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;fill:#c9c9d2}
      .box{fill:#0f0f14;stroke:#2c2c38;stroke-width:1.2}
      .in{fill:#15151c;stroke:#34344a;stroke-width:1}
      .core{fill:#17142a;stroke:#a78bfa;stroke-width:1.4}
      .zt{fill:none;stroke:#7be3a3;stroke-width:1.5;stroke-dasharray:7 6}
      .zu{fill:none;stroke:#f0776b;stroke-width:1.5;stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1240" height="760" fill="#050507"/>

  <!-- trusted zone -->
  <rect class="zt" x="24" y="56" width="800" height="520" rx="22"/>
  <text class="h" x="46" y="84" style="fill:#7be3a3">TRUSTED: YOUR MACHINE</text>
  <text class="s" x="46" y="102">the node, the seed-derived key, and every check that decides what is true</text>

  <!-- untrusted zone -->
  <rect class="zu" x="868" y="56" width="348" height="520" rx="22"/>
  <text class="h" x="890" y="84" style="fill:#f0776b">UNTRUSTED: NETWORK AND RELAYS</text>
  <text class="s" x="890" y="102">may withhold, reorder, replay or forge</text>

  <!-- LND -->
  <rect class="box" x="48" y="130" width="250" height="230" rx="16"/>
  <text class="t" x="68" y="160">LND node</text>
  <text class="s" x="68" y="182">regtest-verified, v0.20</text>
  <rect class="in" x="66" y="196" width="214" height="34" rx="8"/><text class="m" x="78" y="218">SubscribeChannelBackups</text>
  <rect class="in" x="66" y="238" width="214" height="34" rx="8"/><text class="m" x="78" y="260">DeriveSharedKey (signer)</text>
  <rect class="in" x="66" y="280" width="214" height="34" rx="8"/><text class="m" x="78" y="302">VerifyChanBackup</text>
  <rect class="in" x="66" y="322" width="214" height="28" rx="8"/><text class="m" x="78" y="341">RestoreChannelBackups</text>

  <!-- Lifeboat -->
  <rect class="core" x="360" y="130" width="440" height="432" rx="18"/>
  <text class="t" x="382" y="160">Lifeboat</text>
  <text class="s" x="382" y="182">read-only macaroon while running; restore adds import + dial</text>
  <rect class="in" x="382" y="200" width="196" height="84" rx="10"/><text class="t" x="396" y="226" style="font-size:15px">BackupService</text><text class="s" x="396" y="247">state machine</text><text class="s" x="396" y="266">retry, jittered backoff</text>
  <rect class="in" x="592" y="200" width="186" height="84" rx="10"/><text class="t" x="606" y="226" style="font-size:15px">Fingerprinting</text><text class="s" x="606" y="247">hash of channel points</text><text class="s" x="606" y="266">(blobs never compare equal)</text>
  <rect class="in" x="382" y="298" width="196" height="84" rx="10"/><text class="t" x="396" y="324" style="font-size:15px">Encryption</text><text class="s" x="396" y="345">NIP-44 v2 + padding</text><text class="s" x="396" y="364">key from the seed, never stored</text>
  <rect class="in" x="592" y="298" width="186" height="84" rx="10"/><text class="t" x="606" y="324" style="font-size:15px">Verification</text><text class="s" x="606" y="345">relay copy vs live node</text><text class="s" x="606" y="364">per-relay health, lnd decrypts</text>
  <rect class="in" x="382" y="396" width="396" height="80" rx="10"/><text class="t" x="396" y="422" style="font-size:15px">Local event validation</text><text class="s" x="396" y="443">author, kind, d tag, signature, payload, channel set:</text><text class="s" x="396" y="461">re-checked here, never taken on a relay's word</text>
  <rect class="in" x="382" y="488" width="396" height="60" rx="10"/><text class="t" x="396" y="512" style="font-size:15px">Console</text><text class="s" x="396" y="530">127.0.0.1 only · token · Host and Origin checks · nonce CSP</text>

  <!-- relays -->
  <rect class="box" x="890" y="130" width="304" height="86" rx="14"/><text class="t" x="910" y="160">Relay A</text><text class="m" x="910" y="184">kind 30078 · d = lifeboat/scb/v1</text><text class="s" x="910" y="203">ciphertext only</text>
  <rect class="box" x="890" y="232" width="304" height="86" rx="14"/><text class="t" x="910" y="262">Relay B</text><text class="m" x="910" y="286">newest event per key wins</text><text class="s" x="910" y="305">sees key, timing, rough size, IP</text>
  <rect class="box" x="890" y="334" width="304" height="86" rx="14"/><text class="t" x="910" y="364">Relay C …</text><text class="m" x="910" y="388">up to 10 relays</text><text class="s" x="910" y="407">any one holding the newest copy is enough</text>
  <text class="s" x="890" y="450">public relays were tested with a</text>
  <text class="s" x="890" y="468">throwaway key and dummy data only</text>

  <!-- arrows -->
  <path d="M298 245H358" stroke="#7be3a3" stroke-width="2" marker-end="url(#g)" fill="none"/>
  <text class="s" x="304" y="232" style="font-size:11px">TLS-pinned</text>
  <path d="M800 260H888" stroke="#a78bfa" stroke-width="2" marker-end="url(#p)" fill="none"/>
  <text class="s" x="812" y="250" style="font-size:11px">publish</text>
  <path d="M888 360H800" stroke="#c9c9d2" stroke-width="2" stroke-dasharray="5 4" marker-end="url(#a)" fill="none"/>
  <text class="s" x="812" y="378" style="font-size:11px">read (re-validated)</text>

  <!-- boundary label -->
  <text class="h" x="852" y="556" transform="rotate(-90 852 556)" style="fill:#8a8a98;font-size:11px">TRUST BOUNDARY</text>

  <!-- recovery flow -->
  <rect class="box" x="24" y="604" width="1192" height="132" rx="18"/>
  <text class="h" x="46" y="632" style="fill:#a78bfa">AFTER A DISASTER: SEED ONLY</text>
  <g>
    <rect class="in" x="46" y="650" width="210" height="62" rx="10"/><text class="t" x="60" y="676" style="font-size:14px">1. New LND</text><text class="s" x="60" y="696">created from the 24 words</text>
    <rect class="in" x="292" y="650" width="210" height="62" rx="10"/><text class="t" x="306" y="676" style="font-size:14px">2. Same key</text><text class="s" x="306" y="696">re-derived through the signer</text>
    <rect class="in" x="538" y="650" width="210" height="62" rx="10"/><text class="t" x="552" y="676" style="font-size:14px">3. Fetch</text><text class="s" x="552" y="696">newest usable event, any relay</text>
    <rect class="in" x="784" y="650" width="210" height="62" rx="10"/><text class="t" x="798" y="676" style="font-size:14px">4. Validate locally</text><text class="s" x="798" y="696">signature, payload, fingerprint</text>
    <rect class="in" x="1030" y="650" width="164" height="62" rx="10"/><text class="t" x="1044" y="676" style="font-size:14px">5. Restore</text><text class="s" x="1044" y="696">import, redial peers</text>
  </g>
  <path d="M256 681H290" stroke="#c9c9d2" stroke-width="1.8" marker-end="url(#a)" fill="none"/>
  <path d="M502 681H536" stroke="#c9c9d2" stroke-width="1.8" marker-end="url(#a)" fill="none"/>
  <path d="M748 681H782" stroke="#c9c9d2" stroke-width="1.8" marker-end="url(#a)" fill="none"/>
  <path d="M994 681H1028" stroke="#c9c9d2" stroke-width="1.8" marker-end="url(#a)" fill="none"/>
  <text class="s" x="46" y="728" style="font-size:12px">Peers force-close and funds return on-chain. Channels do not survive a restore: this is a static channel backup, not a dynamic one.</text>
</svg>
